<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación de recogida - Taxi Plaza Lima Sur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../assets/css/base.css">
    <link rel="stylesheet" href="../../../assets/css/componentes.css">
    <link rel="stylesheet" href="../../../assets/css/layout.css">
    <link rel="stylesheet" href="../../../assets/css/accesibilidad.css">
    <link rel="stylesheet" href="confirmacion-recogida.css">
</head>

<body data-ruta-raiz="../../../">

    <div class="layout-app">
        <aside class="sidebar" id="sidebar" aria-label="Menú principal">
            <div class="sidebar-cabecera"><a href="../../../index.html" class="logo"><span class="logo-icono">🚖</span><span class="logo-texto">Taxi Plaza <strong>Lima Sur</strong></span></a></div>
            <div class="sidebar-usuario">Taxista<strong id="nombre-usuario">—</strong></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
        </aside>
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <div class="contenido-app">
            <header class="barra-app"><button type="button" class="boton-menu-movil" id="btn-menu-movil" aria-label="Abrir menú">☰</button><span class="barra-app-titulo">Confirmación de recogida</span></header>
            <main class="pagina-app">
                <div class="encabezado-seccion">
                    <h1>Confirmar recogida</h1>
                    <p>Verifica que recogiste el producto correctamente</p>
                </div>
                <div id="barra-progreso-servicio" hidden></div>
                <div class="tarjeta">
                    <h2 id="titulo-producto"></h2>
                    <div class="foto-placeholder" aria-label="Espacio para foto de recogida">
                        <span>📷</span>
                        <p>Foto del producto recogido</p>
                    </div>
                    <form id="formulario-recogida" class="formulario">
                        <label class="grupo-campo grupo-checkbox">
                            <input type="checkbox" id="confirmar-recogida" required>
                            Confirmo que recogí el producto en buen estado
                        </label>
                        <p id="mensaje-recogida" class="mensaje-formulario" hidden></p>
                        <button type="submit" class="boton-primario boton-primario--ancho" id="btn-confirmar" disabled>Confirmar recogida</button>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <div class="contenedor-accesibilidad">
        <button type="button" class="boton-accesibilidad" aria-label="Opciones de accesibilidad"
            aria-expanded="false" aria-controls="panel-accesibilidad">♿</button>
        <div id="panel-accesibilidad" class="panel-accesibilidad" role="region"
            aria-label="Panel de accesibilidad" hidden>
            <h3>Accesibilidad</h3>
            <label><input type="checkbox" id="alto-contraste"> Alto contraste</label>
            <label><input type="checkbox" id="texto-grande"> Texto grande</label>
        </div>
    </div>

    <script src="../../../assets/js/nucleo/config-api.js"></script>
    <script src="../../../assets/js/nucleo/almacenamiento.js"></script>
    <script src="../../../assets/js/nucleo/api-cliente.js"></script>
    <script src="../../../assets/js/nucleo/navegacion.js"></script>
    <script src="../../../assets/js/servicios/servicio-autenticacion.js"></script>
    <script src="../../../assets/js/servicios/servicio-servicios.js"></script>
    <script src="../../../assets/js/servicios/servicio-notificaciones.js"></script>
    <script src="../../../assets/js/servicios/servicio-perfil.js"></script>
    <script src="../../../assets/js/nucleo/layout-app.js"></script>
    <script src="../../../assets/js/nucleo/accesibilidad.js"></script>
    <script src="confirmacion-recogida.js"></script>
</body>

</html>
