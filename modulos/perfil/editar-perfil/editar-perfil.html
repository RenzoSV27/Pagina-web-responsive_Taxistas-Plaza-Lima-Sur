<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar perfil - Taxi Plaza Lima Sur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../assets/css/base.css">
    <link rel="stylesheet" href="../../../assets/css/componentes.css">
    <link rel="stylesheet" href="../../../assets/css/layout.css">
    <link rel="stylesheet" href="../../../assets/css/accesibilidad.css">
    <link rel="stylesheet" href="editar-perfil.css">
</head>

<body data-ruta-raiz="../../../">

    <div class="layout-app">
        <aside class="sidebar" id="sidebar" aria-label="Menú principal">
            <div class="sidebar-cabecera">
                <a href="../../../index.html" class="logo">
                    <span class="logo-icono" aria-hidden="true">🚖</span>
                    <span class="logo-texto">Taxi Plaza <strong>Lima Sur</strong></span>
                </a>
            </div>
            <div class="sidebar-usuario">Taxista<strong id="nombre-usuario">—</strong></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
        </aside>
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <div class="contenido-app">
            <header class="barra-app">
                <button type="button" class="boton-menu-movil" id="btn-menu-movil" aria-label="Abrir menú">☰</button>
                <span class="barra-app-titulo">Editar perfil</span>
            </header>
            <main class="pagina-app">
                <div class="encabezado-seccion">
                    <h1>Editar perfil</h1>
                    <p>Actualiza tu información personal y del vehículo</p>
                </div>

                <div class="tarjeta tarjeta-formulario">
                    <form id="formulario-editar-perfil" class="formulario" novalidate>
                        <div class="grupo-campo">
                            <label for="nombre">Nombre completo</label>
                            <input type="text" id="nombre" name="nombre" required placeholder="Carlos Mendoza">
                        </div>
                        <div class="grupo-campo">
                            <label for="telefono">Teléfono</label>
                            <input type="tel" id="telefono" name="telefono" required placeholder="+51 987 654 321">
                        </div>
                        <div class="grupo-campo">
                            <label for="placa">Placa del vehículo</label>
                            <input type="text" id="placa" name="placa" required placeholder="ABC-123">
                        </div>
                        <div class="grupo-campo">
                            <label for="vehiculo">Vehículo</label>
                            <input type="text" id="vehiculo" name="vehiculo" required placeholder="Toyota Yaris 2019">
                        </div>
                        <p id="mensaje-editar-perfil" class="mensaje-formulario" hidden></p>
                        <div class="acciones-flujo">
                            <button type="submit" class="boton-primario">Guardar cambios</button>
                            <a href="../perfil-taxista/perfil-taxista.html" class="boton-secundario">Cancelar</a>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <div class="contenedor-accesibilidad">
        <button type="button" class="boton-accesibilidad" aria-label="Opciones de accesibilidad"
            aria-expanded="false" aria-controls="panel-accesibilidad">♿</button>
        <div id="panel-accesibilidad" class="panel-accesibilidad" role="region"
            aria-label="Panel de accesibilidad" hidden>
            <h3>Accesibilidad</h3>
            <label><input type="checkbox" id="alto-contraste"> Alto contraste</label>
            <label><input type="checkbox" id="texto-grande"> Texto grande</label>
        </div>
    </div>

    <script src="../../../assets/js/nucleo/config-api.js"></script>
    <script src="../../../assets/js/nucleo/almacenamiento.js"></script>
    <script src="../../../assets/js/nucleo/api-cliente.js"></script>
    <script src="../../../assets/js/nucleo/navegacion.js"></script>
    <script src="../../../assets/js/servicios/servicio-autenticacion.js"></script>
    <script src="../../../assets/js/servicios/servicio-servicios.js"></script>
    <script src="../../../assets/js/servicios/servicio-notificaciones.js"></script>
    <script src="../../../assets/js/servicios/servicio-perfil.js"></script>
    <script src="../../../assets/js/nucleo/layout-app.js"></script>
    <script src="../../../assets/js/nucleo/accesibilidad.js"></script>
    <script src="editar-perfil.js"></script>
</body>

</html>
