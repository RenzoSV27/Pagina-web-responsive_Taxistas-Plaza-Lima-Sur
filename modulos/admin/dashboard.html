<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../assets/js/nucleo/tema-anticipado.js"></script>
    <title>Panel Admin - Taxi Plaza Lima Sur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../../assets/css/bootstrap-custom.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="dashboard.css">
</head>

<body data-ruta-raiz="../../" class="admin-layout">

    <header class="admin-cabecera">
        <div>
            <h1>🚖 Taxi Plaza Lima Sur <span class="badge-rol">Administrador</span></h1>
            <small id="nombre-admin">—</small>
        </div>
        <button type="button" class="btn btn-outline-light btn-sm" id="btn-cerrar-sesion">Cerrar sesión</button>
    </header>

    <main class="admin-contenido" id="contenido-principal">
        <div class="admin-resumen" id="resumen-admin" aria-label="Resumen general"></div>

        <div class="admin-tabs" role="tablist">
            <button type="button" class="activo" data-tab="servicios" role="tab" aria-selected="true">Viajes / Servicios</button>
            <button type="button" data-tab="taxistas" role="tab" aria-selected="false">Taxistas</button>
        </div>

        <p id="mensaje-admin" class="mensaje-admin" hidden role="alert"></p>

        <!-- Panel Servicios -->
        <section class="admin-panel" id="panel-servicios" role="tabpanel">
            <div class="admin-toolbar">
                <h2 class="h5 mb-0">Gestión de viajes</h2>
                <div class="d-flex gap-2 flex-wrap">
                    <select id="filtro-estado-servicio" class="form-select form-select-sm" style="width:auto">
                        <option value="">Todos los estados</option>
                        <option value="disponible">Disponible</option>
                        <option value="asignado">Asignado</option>
                        <option value="completado">Completado</option>
                        <option value="cancelado">Cancelado</option>
                    </select>
                    <button type="button" class="btn btn-taxi-primary btn-sm" id="btn-nuevo-servicio">+ Nuevo viaje</button>
                </div>
            </div>

            <form id="form-servicio" class="formulario-admin" hidden>
                <input type="hidden" id="servicio-id">
                <label>Tienda<input type="text" id="servicio-tienda" required></label>
                <label>Origen<input type="text" id="servicio-origen" required></label>
                <label>Destino<input type="text" id="servicio-destino" required></label>
                <label>Producto<input type="text" id="servicio-producto" required></label>
                <label>Peso<input type="text" id="servicio-peso" required placeholder="2 kg"></label>
                <label>Tarifa (S/)<input type="number" id="servicio-tarifa" required min="0" step="0.5"></label>
                <label>Distancia<input type="text" id="servicio-distancia" placeholder="3.5 km"></label>
                <label>Tiempo estimado<input type="text" id="servicio-tiempo" placeholder="15 min"></label>
                <label>Cliente<input type="text" id="servicio-cliente" required></label>
                <label>Teléfono cliente<input type="text" id="servicio-telefono" required></label>
                <label class="campo-ancho">Notas<textarea id="servicio-notas" rows="2"></textarea></label>
                <label><input type="checkbox" id="servicio-prioridad"> Prioridad alta</label>
                <div class="campo-ancho d-flex gap-2">
                    <button type="submit" class="btn btn-taxi-primary btn-sm">Guardar viaje</button>
                    <button type="button" class="btn btn-secondary btn-sm" id="btn-cancelar-servicio-form">Cancelar</button>
                </div>
            </form>

            <div class="table-responsive">
                <table class="tabla-admin" id="tabla-servicios">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tienda → Destino</th>
                            <th>Tarifa</th>
                            <th>Estado</th>
                            <th>Taxista</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <!-- Panel Taxistas -->
        <section class="admin-panel" id="panel-taxistas" role="tabpanel" hidden>
            <div class="admin-toolbar">
                <h2 class="h5 mb-0">Gestión de taxistas</h2>
                <button type="button" class="btn btn-taxi-primary btn-sm" id="btn-nuevo-taxista">+ Nuevo taxista</button>
            </div>

            <form id="form-taxista" class="formulario-admin" hidden>
                <input type="hidden" id="taxista-id">
                <label>Nombre<input type="text" id="taxista-nombre" required></label>
                <label>DNI<input type="text" id="taxista-dni" required maxlength="8" pattern="\d{8}"></label>
                <label>Correo<input type="email" id="taxista-correo" required></label>
                <label>Teléfono<input type="text" id="taxista-telefono" required></label>
                <label>Placa<input type="text" id="taxista-placa" required></label>
                <label>Vehículo<input type="text" id="taxista-vehiculo"></label>
                <label>Licencia<input type="text" id="taxista-licencia"></label>
                <label>Estado
                    <select id="taxista-estado">
                        <option value="disponible">Disponible</option>
                        <option value="ocupado">Ocupado</option>
                        <option value="inactivo">Inactivo</option>
                    </select>
                </label>
                <label>Contraseña<input type="password" id="taxista-contrasena" minlength="6" placeholder="Solo al crear o cambiar"></label>
                <div class="campo-ancho d-flex gap-2">
                    <button type="submit" class="btn btn-taxi-primary btn-sm">Guardar taxista</button>
                    <button type="button" class="btn btn-secondary btn-sm" id="btn-cancelar-taxista-form">Cancelar</button>
                </div>
            </form>

            <div class="table-responsive">
                <table class="tabla-admin" id="tabla-taxistas">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Placa</th>
                            <th>Estado</th>
                            <th>Viajes</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="../../assets/js/nucleo/config-api.js"></script>
    <script src="../../assets/js/nucleo/almacenamiento.js"></script>
    <script src="../../assets/js/nucleo/api-cliente.js"></script>
    <script src="../../assets/js/servicios/servicio-autenticacion.js"></script>
    <script src="../../assets/js/servicios/servicio-admin.js"></script>
    <script src="dashboard.js"></script>
</body>

</html>
