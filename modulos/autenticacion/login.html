<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../assets/js/nucleo/tema-anticipado.js"></script>
    <title>Iniciar sesión - Taxi Plaza Lima Sur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../../assets/css/bootstrap-custom.css">

    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/componentes.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/accesibilidad.css">
    <link rel="stylesheet" href="autenticacion.css">
</head>

<body data-ruta-raiz="../../" class="pagina-publica">

    <header>
        <nav class="navbar navbar-expand-lg navbar-taxi" aria-label="Navegación de autenticación">
            <div class="container-fluid">
                <a class="navbar-brand logo" href="../../index.html">
                    <span class="logo-icono" aria-hidden="true">🚖</span>
                    <span class="logo-texto">Taxi Plaza <strong>Lima Sur</strong></span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menu-auth" aria-controls="menu-auth"
                    aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="menu-auth">
                    <a href="registro.html" class="btn btn-taxi-primary">Registrarse</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="pagina-auth" id="contenido-principal">
        <div class="container py-4">
        <div class="tarjeta tarjeta-auth mx-auto" style="max-width:420px">
            <h1>Iniciar sesión</h1>
            <p>Accede a tu panel de taxista</p>
            <p class="credenciales-demo">Demo: <strong>taxista@demo.com</strong> / <strong>demo123</strong></p>
            <form id="formulario-login" class="formulario" novalidate aria-label="Formulario de inicio de sesión">
                <div class="grupo-campo mb-3">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" class="form-control" required autocomplete="email"
                        placeholder="tu@correo.com" value="taxista@demo.com" aria-required="true">
                </div>
                <div class="grupo-campo mb-3">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" class="form-control" required
                        autocomplete="current-password" placeholder="••••••••" value="demo123" aria-required="true">
                </div>
                <p id="mensaje-login" class="mensaje-formulario" role="alert" hidden></p>
                <button type="submit" class="boton-primario boton-primario--ancho btn btn-taxi-primary w-100">Ingresar</button>
            </form>
            <p class="enlace-formulario">
                <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
            </p>
            <p class="enlace-formulario">
                ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
            </p>
        </div>
        </div>
    </main>

    <footer class="pie-sitio">
        <p>© 2026 Taxi Plaza Lima Sur</p>
    </footer>

    <div class="contenedor-accesibilidad">
        <button type="button" class="boton-accesibilidad" aria-label="Opciones de accesibilidad"
            aria-expanded="false" aria-controls="panel-accesibilidad">♿</button>
        <div id="panel-accesibilidad" class="panel-accesibilidad" role="region"
            aria-label="Panel de accesibilidad" hidden>
            <h3>Accesibilidad</h3>
            <label><input type="checkbox" id="alto-contraste"> Alto contraste</label>
            <label><input type="checkbox" id="texto-grande"> Texto grande</label>
        </div>
    </div>

    <script src="../../assets/js/nucleo/config-api.js"></script>
    <script src="../../assets/js/nucleo/almacenamiento.js"></script>
    <script src="../../assets/js/nucleo/api-cliente.js"></script>
    <script src="../../assets/js/servicios/servicio-autenticacion.js"></script>
    <script src="../../assets/js/nucleo/accesibilidad.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../../assets/js/nucleo/bootstrap-init.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="../../assets/js/nucleo/animaciones.js"></script>
    <script src="login.js"></script>
</body>

</html>
