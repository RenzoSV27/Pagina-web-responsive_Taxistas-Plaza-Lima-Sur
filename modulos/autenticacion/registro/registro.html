<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de taxista - Taxi Plaza Lima Sur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../assets/css/base.css">
    <link rel="stylesheet" href="../../../assets/css/componentes.css">
    <link rel="stylesheet" href="../../../assets/css/layout.css">
    <link rel="stylesheet" href="../../../assets/css/accesibilidad.css">
    <link rel="stylesheet" href="registro.css">
</head>

<body data-ruta-raiz="../../../" class="pagina-publica">

    <header class="barra-navegacion">
        <a href="../../../index.html" class="logo">
            <span class="logo-icono" aria-hidden="true">🚖</span>
            <span class="logo-texto">Taxi Plaza <strong>Lima Sur</strong></span>
        </a>
        <nav class="nav-botones">
            <a href="../inicio-sesion/inicio-sesion.html" class="boton-nav-login">Iniciar sesión</a>
        </nav>
    </header>

    <main class="pagina-auth">
        <div class="tarjeta tarjeta-auth tarjeta-auth--ancho">
            <h1>Registro de taxista</h1>
            <p>Completa tus datos para unirte a la plataforma</p>
            <form id="formulario-registro" class="formulario" novalidate>
                <div class="grupo-campo">
                    <label for="nombre">Nombre completo *</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Carlos Mendoza">
                </div>
                <div class="grupo-campo">
                    <label for="dni">DNI *</label>
                    <input type="text" id="dni" name="dni" required placeholder="45678912" maxlength="8">
                </div>
                <div class="grupo-campo">
                    <label for="telefono">Teléfono *</label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="+51 987 654 321">
                </div>
                <div class="grupo-campo">
                    <label for="placa">Placa del vehículo *</label>
                    <input type="text" id="placa" name="placa" required placeholder="ABC-123">
                </div>
                <div class="grupo-campo">
                    <label for="correo">Correo electrónico *</label>
                    <input type="email" id="correo" name="correo" required placeholder="tu@correo.com">
                </div>
                <div class="grupo-campo">
                    <label for="contrasena">Contraseña *</label>
                    <input type="password" id="contrasena" name="contrasena" required minlength="6" placeholder="Mínimo 6 caracteres">
                </div>
                <div class="grupo-campo">
                    <label>
                        <input type="checkbox" id="acepta-terminos" required>
                        Acepto los <a href="../../legal/terminos-condiciones/terminos-condiciones.html" target="_blank">términos y condiciones</a>
                    </label>
                </div>
                <p id="mensaje-registro" class="mensaje-formulario" hidden></p>
                <button type="submit" class="boton-primario boton-primario--ancho">Crear cuenta</button>
            </form>
            <p class="enlace-formulario">
                ¿Ya tienes cuenta? <a href="../inicio-sesion/inicio-sesion.html">Inicia sesión</a>
            </p>
        </div>
    </main>

    <footer class="pie-sitio"><p>© 2026 Taxi Plaza Lima Sur</p></footer>

    <div class="contenedor-accesibilidad">
        <button type="button" class="boton-accesibilidad" aria-label="Opciones de accesibilidad"
            aria-expanded="false" aria-controls="panel-accesibilidad">♿</button>
        <div id="panel-accesibilidad" class="panel-accesibilidad" role="region" aria-label="Panel de accesibilidad" hidden>
            <h3>Accesibilidad</h3>
            <label><input type="checkbox" id="alto-contraste"> Alto contraste</label>
            <label><input type="checkbox" id="texto-grande"> Texto grande</label>
        </div>
    </div>

    <script src="../../../assets/js/datos/datos-ejemplo.js"></script>
    <script src="../../../assets/js/nucleo/almacenamiento.js"></script>
    <script src="../../../assets/js/servicios/servicio-autenticacion.js"></script>
    <script src="../../../assets/js/nucleo/accesibilidad.js"></script>
    <script src="registro.js"></script>
</body>

</html>
