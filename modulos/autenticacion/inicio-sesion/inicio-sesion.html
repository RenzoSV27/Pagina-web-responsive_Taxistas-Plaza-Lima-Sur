<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Taxi Plaza Lima Sur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../assets/css/base.css">
    <link rel="stylesheet" href="../../../assets/css/componentes.css">
    <link rel="stylesheet" href="../../../assets/css/layout.css">
    <link rel="stylesheet" href="../../../assets/css/accesibilidad.css">
    <link rel="stylesheet" href="inicio-sesion.css">
</head>

<body data-ruta-raiz="../../../" class="pagina-publica">

    <header class="barra-navegacion">
        <a href="../../../index.html" class="logo">
            <span class="logo-icono" aria-hidden="true">🚖</span>
            <span class="logo-texto">Taxi Plaza <strong>Lima Sur</strong></span>
        </a>
        <nav class="nav-botones">
            <a href="../registro/registro.html" class="boton-nav-registro">Registrarse</a>
        </nav>
    </header>

    <main class="pagina-auth">
        <div class="tarjeta tarjeta-auth">
            <h1>Iniciar sesión</h1>
            <p>Accede a tu panel de taxista</p>
            <p class="credenciales-demo">Demo: <strong>taxista@demo.com</strong> / <strong>demo123</strong></p>
            <form id="formulario-login" class="formulario" novalidate>
                <div class="grupo-campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" required autocomplete="email"
                        placeholder="tu@correo.com" value="taxista@demo.com">
                </div>
                <div class="grupo-campo">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" required
                        autocomplete="current-password" placeholder="••••••••" value="demo123">
                </div>
                <p id="mensaje-login" class="mensaje-formulario" hidden></p>
                <button type="submit" class="boton-primario boton-primario--ancho">Ingresar</button>
            </form>
            <p class="enlace-formulario">
                <a href="../recuperar-contrasena/recuperar-contrasena.html">¿Olvidaste tu contraseña?</a>
            </p>
            <p class="enlace-formulario">
                ¿No tienes cuenta? <a href="../registro/registro.html">Regístrate</a>
            </p>
        </div>
    </main>

    <footer class="pie-sitio">
        <p>© 2026 Taxi Plaza Lima Sur</p>
    </footer>

    <div class="contenedor-accesibilidad">
        <button type="button" class="boton-accesibilidad" aria-label="Opciones de accesibilidad"
            aria-expanded="false" aria-controls="panel-accesibilidad">♿</button>
        <div id="panel-accesibilidad" class="panel-accesibilidad" role="region"
            aria-label="Panel de accesibilidad" hidden>
            <h3>Accesibilidad</h3>
            <label><input type="checkbox" id="alto-contraste"> Alto contraste</label>
            <label><input type="checkbox" id="texto-grande"> Texto grande</label>
        </div>
    </div>

    <script src="../../../assets/js/nucleo/config-api.js"></script>
    <script src="../../../assets/js/nucleo/almacenamiento.js"></script>
    <script src="../../../assets/js/nucleo/api-cliente.js"></script>
    <script src="../../../assets/js/servicios/servicio-autenticacion.js"></script>
    <script src="../../../assets/js/nucleo/accesibilidad.js"></script>
    <script src="inicio-sesion.js"></script>
</body>

</html>
