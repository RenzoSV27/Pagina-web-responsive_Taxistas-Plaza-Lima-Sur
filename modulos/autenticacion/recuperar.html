<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - Taxi Plaza Lima Sur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../../assets/css/bootstrap-custom.css">

    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/componentes.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/accesibilidad.css">
    <link rel="stylesheet" href="autenticacion.css">
</head>

<body data-ruta-raiz="../../" class="pagina-publica">

    <header class="barra-navegacion">
        <a href="../../index.html" class="logo">
            <span class="logo-icono" aria-hidden="true">🚖</span>
            <span class="logo-texto">Taxi Plaza <strong>Lima Sur</strong></span>
        </a>
        <nav class="nav-botones">
            <a href="login.html" class="boton-nav-login">Iniciar sesión</a>
        </nav>
    </header>

    <main class="pagina-auth">
        <div class="tarjeta tarjeta-auth">
            <h1>Recuperar contraseña</h1>
            <p>Ingresa tu correo y te enviaremos un enlace de recuperación</p>
            <form id="formulario-recuperar" class="formulario" novalidate>
                <div class="grupo-campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" required placeholder="tu@correo.com">
                </div>
                <p id="mensaje-recuperar" class="mensaje-formulario" hidden></p>
                <button type="submit" class="boton-primario boton-primario--ancho">Enviar enlace</button>
            </form>
            <p class="enlace-formulario">
                <a href="login.html">Volver al inicio de sesión</a>
            </p>
        </div>
    </main>

    <footer class="pie-sitio"><p>© 2026 Taxi Plaza Lima Sur</p></footer>

    <div class="contenedor-accesibilidad">
        <button type="button" class="boton-accesibilidad" aria-label="Opciones de accesibilidad"
            aria-expanded="false" aria-controls="panel-accesibilidad">♿</button>
        <div id="panel-accesibilidad" class="panel-accesibilidad" role="region" aria-label="Panel de accesibilidad" hidden>
            <h3>Accesibilidad</h3>
            <label><input type="checkbox" id="alto-contraste"> Alto contraste</label>
            <label><input type="checkbox" id="texto-grande"> Texto grande</label>
        </div>
    </div>

    <script src="../../assets/js/nucleo/config-api.js"></script>
    <script src="../../assets/js/nucleo/almacenamiento.js"></script>
    <script src="../../assets/js/nucleo/api-cliente.js"></script>
    <script src="../../assets/js/servicios/servicio-autenticacion.js"></script>
    <script src="../../assets/js/nucleo/accesibilidad.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../../assets/js/nucleo/bootstrap-init.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="../../assets/js/nucleo/animaciones.js"></script>
    <script src="recuperar.js"></script>
</body>

</html>
